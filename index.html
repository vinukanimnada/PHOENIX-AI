<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOENIX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg-panel: #0a1020;
    --bg-bubble-ai: #0e1830;
    --bg-bubble-user: #0d2440;
    --neon: #00d9ff;
    --neon-dim: #00d9ff26;
    --electric: #0066ff;
    --text: #e8f6ff;
    --muted: #4a6280;
    --border: #14203a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(5,8,16,0.85);
    backdrop-filter: blur(8px);
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .glyph { width: 32px; height: 32px; position: relative; flex-shrink: 0; }
  .glyph svg { width: 100%; height: 100%; filter: drop-shadow(0 0 5px var(--neon)); }
  .glyph.igniting svg { animation: ignite 1.1s ease-in-out infinite; }

  @keyframes ignite {
    0%, 100% { filter: drop-shadow(0 0 5px var(--neon)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 14px var(--neon)) drop-shadow(0 0 24px var(--electric)); transform: scale(1.08); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 2.5px;
    background: linear-gradient(90deg, var(--neon), var(--electric));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  .icon-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .icon-btn:hover { border-color: var(--neon); color: var(--neon); }

  #chat-scroll {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .chat-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .empty-hero {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  .empty-hero .glyph { width: 56px; height: 56px; margin: 0 auto 20px; }
  .empty-hero h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .empty-hero p { font-size: 14px; }

  .msg { display: flex; gap: 12px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0;
    font-family: 'Orbitron', sans-serif;
  }
  .msg.ai .avatar { background: var(--neon-dim); color: var(--neon); border: 1px solid var(--neon); }
  .msg.user .avatar { background: var(--bg-panel); color: var(--muted); border: 1px solid var(--border); }

  .bubble {
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    max-width: 620px;
  }
  .msg.ai .bubble { background: var(--bg-bubble-ai); border: 1px solid var(--border); border-top-left-radius: 3px; }
  .msg.user .bubble { background: var(--bg-bubble-user); border: 1px solid #133a5c; border-top-right-radius: 3px; }

  .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

  .thinking { display: flex; gap: 5px; padding: 4px 0; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--neon);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .input-bar {
    position: relative;
    z-index: 2;
    border-top: 1px solid var(--border);
    background: rgba(5,8,16,0.9);
    backdrop-filter: blur(8px);
    padding: 16px 24px 20px;
  }

  .input-inner { max-width: 780px; margin: 0 auto; }

  .mode-row { display: flex; gap: 8px; margin-bottom: 10px; }

  .mode-chip {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-chip.active { border-color: var(--neon); color: var(--neon); background: var(--neon-dim); }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s ease;
  }
  .input-row:focus-within { border-color: var(--neon); }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    resize: none;
    max-height: 160px;
    line-height: 1.5;
    padding: 6px 0;
  }
  #user-input::placeholder { color: var(--muted); }

  button.send {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, var(--electric), var(--neon));
    color: #001018;
    border: none;
    border-radius: 9px;
    padding: 12px 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.2s ease, transform 0.1s ease;
  }
  button.send:hover { filter: brightness(1.15); }
  button.send:active { transform: scale(0.97); }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: rgba(2,4,10,0.7);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 90%;
    max-width: 420px;
  }
  .modal h3 {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--neon);
    margin-bottom: 16px;
  }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
  .modal input {
    width: 100%;
    background: #050a16;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 11px 13px;
    margin-bottom: 6px;
  }
  .modal input:focus { outline: none; border-color: var(--neon); }
  .modal small { display: block; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
  .modal small a { color: var(--neon); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .modal-actions button {
    font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer; border: none;
  }
  .btn-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border) !important; }
  .btn-save { background: linear-gradient(90deg, var(--electric), var(--neon)); color: #001018; }

  @media (prefers-reduced-motion: reduce) {
    .glyph.igniting svg { animation: none; }
    .thinking span { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="glyph" id="glyph">
      <svg viewBox="0 0 44 44" fill="none">
        <path d="M22 4C18 12 12 14 12 22C12 29.2 16.8 34 22 34C27.2 34 32 29.2 32 22C32 14 26 12 22 4Z" stroke="#00d9ff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M22 14C20 18 17 19.5 17 24C17 27.3 19.2 30 22 30C24.8 30 27 27.3 27 24C27 19.5 24 18 22 14Z" fill="#00d9ff" fill-opacity="0.5"/>
        <path d="M22 34V40M14 40H30" stroke="#0066ff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>PHOENIX AI</h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="clear-btn">Clear chat</button>
    <button class="icon-btn" id="settings-btn">API key</button>
  </div>
</header>

<div id="chat-scroll">
  <div class="chat-inner" id="chat-inner">
    <div class="empty-hero" id="empty-hero">
      <div class="glyph">
        <svg viewBox="0 0 44 44" fill="none">
          <path d="M22 4C18 12 12 14 12 22C12 29.2 16.8 34 22 34C27.2 34 32 29.2 32 22C32 14 26 12 22 4Z" stroke="#00d9ff" stroke-width="2" stroke-linejoin="round"/>
          <path d="M22 14C20 18 17 19.5 17 24C17 27.3 19.2 30 22 30C24.8 30 27 27.3 27 24C27 19.5 24 18 22 14Z" fill="#00d9ff" fill-opacity="0.5"/>
          <path d="M22 34V40M14 40H30" stroke="#0066ff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>ASK ME ANYTHING</h2>
      <p>Chat normally, or switch to Image mode to generate pictures.</p>
    </div>
  </div>
</div>

<div class="input-bar">
  <div class="input-inner">
    <div class="mode-row">
      <button class="mode-chip active" data-mode="chat">💬 Chat</button>
      <button class="mode-chip" data-mode="image">🎨 Image</button>
    </div>
    <div class="input-row">
      <textarea id="user-input" rows="1" placeholder="Message Phoenix AI..."></textarea>
      <button class="send" id="send-btn">SEND</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>GEMINI API KEY</h3>
    <label for="api-key">Free key from Google AI Studio</label>
    <input type="password" id="api-key" placeholder="Paste your API key">
    <small>Kept only in this tab's memory — cleared on refresh. Get a free key at <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a></small>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
  let apiKey = '';
  let currentMode = 'chat';
  let history = [];

  const glyph = document.getElementById('glyph');
  const chatInner = document.getElementById('chat-inner');
  const emptyHero = document.getElementById('empty-hero');
  const chatScroll = document.getElementById('chat-scroll');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  document.querySelectorAll('.mode-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentMode = chip.dataset.mode;
      input.placeholder = currentMode === 'chat' ? 'Message Phoenix AI...' : 'Describe an image to generate...';
    });
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  const overlay = document.getElementById('modal-overlay');
  document.getElementById('settings-btn').addEventListener('click', () => overlay.classList.add('show'));
  document.getElementById('modal-cancel').addEventListener('click', () => overlay.classList.remove('show'));
  document.getElementById('modal-save').addEventListener('click', () => {
    apiKey = document.getElementById('api-key').value.trim();
    overlay.classList.remove('show');
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    history = [];
    chatInner.innerHTML = '';
    chatInner.appendChild(emptyHero);
  });

  function setLoading(isLoading) {
    glyph.classList.toggle('igniting', isLoading);
    sendBtn.disabled = isLoading;
  }

  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function addMessage(role, contentHTML) {
    if (emptyHero.parentNode) emptyHero.remove();
    const msg = document.createElement('div');
    msg.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
    msg.innerHTML = `
      <div class="avatar">${role === 'user' ? 'YOU' : 'PHX'}</div>
      <div class="bubble">${contentHTML}</div>
    `;
    chatInner.appendChild(msg);
    scrollToBottom();
    return msg.querySelector('.bubble');
  }

  async function sendChat(text) {
    history.push({ role: 'user', parts: [{ text }] });
    setLoading(true);
    const thinkingBubble = addMessage('ai', '<div class="thinking"><span></span><span></span><span></span></div>');
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: history })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
      history.push({ role: 'model', parts: [{ text: reply }] });
      thinkingBubble.textContent = reply;
    } catch (err) {
      thinkingBubble.textContent = `Error: ${err.message}`;
      history.pop();
    } finally {
      setLoading(false);
      scrollToBottom();
    }
  }

  async function sendImage(prompt) {
    setLoading(true);
    const thinkingBubble = addMessage('ai', '<div class="thinking"><span></span><span></span><span></span></div>');
    const seed = Math.floor(Math.random() * 100000);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&seed=${seed}&nologo=true`;
    const img = new Image();
    img.onload = () => {
      thinkingBubble.innerHTML = `Generated: "${prompt}"<img src="${url}" alt="${prompt}">`;
      setLoading(false);
      scrollToBottom();
    };
    img.onerror = () => {
      thinkingBubble.textContent = 'Image generation failed. Try again.';
      setLoading(false);
    };
    img.src = url;
  }

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;

    if (currentMode === 'chat' && !apiKey) {
      overlay.classList.add('show');
      return;
    }

    addMessage('user', text.replace(/</g, '&lt;'));
    input.value = '';
    input.style.height = 'auto';

    if (currentMode === 'chat') {
      sendChat(text);
    } else {
      sendImage(text);
    }
  });
</script>
</body>
</html>
