<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOENIX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050810;
    --bg-panel: #0a1020;
    --neon: #00d9ff;
    --neon-dim: #00d9ff33;
    --electric: #0066ff;
    --text: #e8f6ff;
    --muted: #4a6280;
    --border: #14203a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ambient grid backdrop */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, var(--neon-dim) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }

  .glyph {
    width: 44px;
    height: 44px;
    position: relative;
    flex-shrink: 0;
  }

  .glyph svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 6px var(--neon));
  }

  .glyph.igniting svg {
    animation: ignite 1.1s ease-in-out infinite;
  }

  @keyframes ignite {
    0%, 100% { filter: drop-shadow(0 0 6px var(--neon)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 18px var(--neon)) drop-shadow(0 0 30px var(--electric)); transform: scale(1.08); }
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, var(--neon), var(--electric));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    color: var(--muted);
    font-size: 14px;
    margin: 4px 0 40px 60px;
    letter-spacing: 0.5px;
  }

  .mode-tabs {
    display: flex;
    gap: 2px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
    width: fit-content;
  }

  .mode-tab {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 7px;
    transition: all 0.2s ease;
  }

  .mode-tab.active {
    background: var(--neon-dim);
    color: var(--neon);
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }

  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    background: #050a16;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 14px;
    resize: vertical;
    transition: border-color 0.2s ease;
  }

  textarea:focus, input:focus {
    outline: none;
    border-color: var(--neon);
  }

  textarea { min-height: 120px; }

  .row { margin-bottom: 18px; }

  button.run {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    font-size: 13px;
    background: linear-gradient(90deg, var(--electric), var(--neon));
    color: #001018;
    border: none;
    border-radius: 8px;
    padding: 14px 28px;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.1s ease;
  }

  button.run:hover { filter: brightness(1.15); }
  button.run:active { transform: scale(0.98); }
  button.run:disabled { opacity: 0.5; cursor: not-allowed; }

  .output {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
  }

  .output img {
    max-width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    box-shadow: 0 0 24px var(--neon-dim);
  }

  .empty-state {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
  }

  .settings-toggle {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }

  .settings {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  .settings.show { display: block; }

  .settings small {
    display: block;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.5;
  }

  .settings small a { color: var(--neon); }

  @media (prefers-reduced-motion: reduce) {
    .glyph.igniting svg { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="glyph" id="glyph">
      <svg viewBox="0 0 44 44" fill="none">
        <path d="M22 4C18 12 12 14 12 22C12 29.2 16.8 34 22 34C27.2 34 32 29.2 32 22C32 14 26 12 22 4Z"
          stroke="#00d9ff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M22 14C20 18 17 19.5 17 24C17 27.3 19.2 30 22 30C24.8 30 27 27.3 27 24C27 19.5 24 18 22 14Z"
          fill="#00d9ff" fill-opacity="0.5"/>
        <path d="M22 34V40M14 40H30" stroke="#0066ff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>PHOENIX AI</h1>
  </header>
  <p class="tagline">Text analysis &amp; image generation, reforged.</p>

  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="text">Analyze Text</button>
    <button class="mode-tab" data-mode="image">Generate Image</button>
  </div>

  <div class="panel">
    <!-- TEXT MODE -->
    <div id="text-mode">
      <div class="row">
        <label for="text-input">Paste text or data</label>
        <textarea id="text-input" placeholder="Paste a report, dataset, transcript, or question..."></textarea>
      </div>
      <button class="run" id="text-run">RUN ANALYSIS</button>
    </div>

    <!-- IMAGE MODE -->
    <div id="image-mode" style="display:none;">
      <div class="row">
        <label for="image-input">Describe the image</label>
        <input type="text" id="image-input" placeholder="A blue phoenix rising over a neon city skyline...">
      </div>
      <button class="run" id="image-run">GENERATE IMAGE</button>
    </div>

    <div id="result-zone">
      <div class="empty-state">Output will appear here.</div>
    </div>
  </div>

  <button class="settings-toggle" id="settings-toggle">API settings</button>
  <div class="settings" id="settings">
    <label for="api-key">Gemini API key (text analysis only — image generation needs no key)</label>
    <input type="password" id="api-key" placeholder="Paste your free Gemini API key">
    <small>
      Stored only in this browser tab's memory — cleared on refresh. Get a free key at
      <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a>.
    </small>
  </div>
</div>

<script>
  let apiKey = '';
  const glyph = document.getElementById('glyph');
  const resultZone = document.getElementById('result-zone');

  // Tab switching
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const mode = tab.dataset.mode;
      document.getElementById('text-mode').style.display = mode === 'text' ? 'block' : 'none';
      document.getElementById('image-mode').style.display = mode === 'image' ? 'block' : 'none';
      resultZone.innerHTML = '<div class="empty-state">Output will appear here.</div>';
    });
  });

  // Settings toggle
  document.getElementById('settings-toggle').addEventListener('click', () => {
    document.getElementById('settings').classList.toggle('show');
  });
  document.getElementById('api-key').addEventListener('input', (e) => {
    apiKey = e.target.value.trim();
  });

  function setLoading(isLoading) {
    glyph.classList.toggle('igniting', isLoading);
  }

  // TEXT ANALYSIS via Gemini
  document.getElementById('text-run').addEventListener('click', async () => {
    const input = document.getElementById('text-input').value.trim();
    if (!input) { resultZone.innerHTML = '<div class="empty-state">Enter some text first.</div>'; return; }
    if (!apiKey) {
      resultZone.innerHTML = '<div class="empty-state">Add your Gemini API key under "API settings" first.</div>';
      document.getElementById('settings').classList.add('show');
      return;
    }
    setLoading(true);
    resultZone.innerHTML = '<div class="empty-state">Analyzing...</div>';
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: `Analyze the following text/data. Give a clear, structured summary with key findings:\n\n${input}` }] }]
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response received.';
      resultZone.innerHTML = `<div class="output"></div>`;
      resultZone.querySelector('.output').textContent = text;
    } catch (err) {
      resultZone.innerHTML = `<div class="empty-state">Error: ${err.message}</div>`;
    } finally {
      setLoading(false);
    }
  });

  // IMAGE GENERATION via Pollinations.ai (no key required)
  document.getElementById('image-run').addEventListener('click', async () => {
    const input = document.getElementById('image-input').value.trim();
    if (!input) { resultZone.innerHTML = '<div class="empty-state">Describe an image first.</div>'; return; }
    setLoading(true);
    resultZone.innerHTML = '<div class="empty-state">Igniting image...</div>';
    const seed = Math.floor(Math.random() * 100000);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(input)}?width=768&height=768&seed=${seed}&nologo=true`;
    const img = new Image();
    img.onload = () => {
      resultZone.innerHTML = `<div class="output"><img src="${url}" alt="${input}"></div>`;
      setLoading(false);
    };
    img.onerror = () => {
      resultZone.innerHTML = '<div class="empty-state">Image generation failed. Try again.</div>';
      setLoading(false);
    };
    img.src = url;
  });
</script>
</body>
</html>
